// Si algo falla, mostrarlo en pantalla (para saber qué pasa en el celular)
function lylFallo(msg) {
  var a = document.getElementById('app'); if (!a || window.__lylOk) return;
  a.innerHTML = '<main style="padding:20px;font-family:system-ui"><div style="background:#fff5f5;border:1px solid #f6c2c4;color:#a1161b;border-radius:12px;padding:14px"><b>La app no pudo abrir.</b><br><br>' + String(msg).replace(/</g, '&lt;') + '</div><button onclick="location.reload()" style="margin-top:14px;width:100%;padding:15px;border:0;border-radius:12px;background:#001847;color:#fff;font-weight:800;font-size:16px">Reintentar</button></main>';
}
window.addEventListener('error', function (e) { lylFallo((e.message || 'Error') + (e.filename ? ' — ' + e.filename.split('/').pop() + ':' + e.lineno : '')) });
window.addEventListener('unhandledrejection', function (e) { lylFallo(e.reason && e.reason.message || e.reason) });
setTimeout(function () { if (!window.__lylOk) lylFallo('Tardó más de 25 segundos en conectar. Revisa el internet del celular y vuelve a intentar.') }, 25000);
</script>

/* ---------- Fotos: compresión en el celular (rápido y liviano) ---------- */
// Reduce la foto en el celular y libera la memoria enseguida (el iPhone recarga la página si se llena)
async function compress(file) {
  let src, tmpUrl = null;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }) }
  catch { tmpUrl = URL.createObjectURL(file); src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = tmpUrl }) }
  const out = async (max, q) => {
    const w = src.width, h = src.height, s = Math.min(1, max / Math.max(w, h));
    const c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
    c.width = c.height = 0;
    return b;
  };
  try { return { full: await out(1280, 0.72), thumb: await out(320, 0.6) } }
  finally { try { src.close && src.close() } catch { } if (tmpUrl) URL.revokeObjectURL(tmpUrl); src = null }
}

/* ---------- Backends ---------- */
async function firebaseBackend(cfg) {
  const B = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [A, F, S, U] = await Promise.all(['firebase-app.js', 'firebase-firestore.js', 'firebase-storage.js', 'firebase-auth.js'].map(f => import(B + f)));
  const app = A.initializeApp(cfg, 'zapatos');
  // Caché en memoria, igual que Lavalyisto (la caché en IndexedDB se dañaba)
  const db = F.initializeFirestore(app, { localCache: F.memoryLocalCache() });
  const st = S.getStorage(app);
  st.maxUploadRetryTime = 20000; st.maxOperationRetryTime = 15000; // no quedarse "subiendo" para siempre
  await U.signInAnonymously(U.getAuth(app));
  const col = F.collection(db, CONFIG.coleccion);
  const meta = { contentType: 'image/jpeg', cacheControl: 'public,max-age=31536000' };
  return {
    newId: () => F.doc(col).id,
    async upload(id, par, slot, full, thumb) {
      // Se guarda en la carpeta "tareas" de Storage, que Lavalyisto ya tiene permitida (no hace falta tocar reglas)
      const p = `tareas/zapatos_${id}_${par}_${slot}_${rid()}`;
      const [a, b] = await Promise.all([S.uploadBytes(S.ref(st, p + '.jpg'), full, meta), S.uploadBytes(S.ref(st, p + '_t.jpg'), thumb, meta)]);
      const [url, t] = await Promise.all([S.getDownloadURL(a.ref), S.getDownloadURL(b.ref)]);
      return { url, thumb: t };
    },
    save: rec => F.setDoc(F.doc(col, rec.id), rec),
    update: (id, data) => F.updateDoc(F.doc(col, id), data),
    recent: async () => (await F.getDocs(F.query(col, F.orderBy('fecha', 'desc'), F.limit(100)))).docs.map(d => d.data()),
    colaboradoras: async () => {
      const [p, u] = await Promise.all([F.getDocs(F.collection(db, CONFIG.pins)), F.getDocs(F.collection(db, CONFIG.usuarios)).catch(() => null)]);
      const users = new Map();
      (u?.docs || []).forEach(d => { const x = d.data(); users.set(String(x.id ?? d.id), x); users.set(d.id, x) });
      return p.docs.map(d => ({ _id: d.id, ...d.data() })).filter(x => x.activo !== false && x.pinHash).map(x => {
        const us = users.get(String(x.id ?? x._id)) || {};
        if (us.activa === false) return null;
        const nombre = us.nombre || us.nombreCompleto || us.name || us.usuario || us.displayName || [us.nombres, us.apellidos].filter(Boolean).join(' ') || ('Colaboradora ' + (x.id ?? x._id));
        return { id: String(x.id ?? x._id), nombre, hash: String(x.pinHash).toLowerCase(), salt: String(x.salt || '') };
      }).filter(Boolean);
    },
    ventasActivas: async () => {
      const desde = new Date(Date.now() - CONFIG.diasPedidos * 864e5).toISOString();
      return (await F.getDocs(F.query(F.collection(db, CONFIG.ventas), F.where('fecha', '>=', desde)))).docs.map(d => ({ _id: d.id, ...d.data() }));
    },
    find: async t => (await F.getDocs(F.query(col, F.where('orden', '==', t), F.limit(10)))).docs.map(d => d.data())
  };
}

function demoBackend() {
  const mem = new Map();
  let dbp;
  try {
    dbp = new Promise((res, rej) => { const r = indexedDB.open('lyl-zapatos', 1); r.onupgradeneeded = () => r.result.createObjectStore('recs', { keyPath: 'id' }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error) }).catch(() => null);
  } catch { dbp = Promise.resolve(null) }
  const tx = async (mode, fn) => { const db = await dbp; if (!db) return null; return new Promise((res, rej) => { const t = db.transaction('recs', mode); const r = fn(t.objectStore('recs')); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error) }) };
  const put = async r => { mem.set(r.id, r); try { await tx('readwrite', s => s.put(r)) } catch { } };
  const toData = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b) });
  return {
    newId: () => 'd' + rid(),
    upload: async (id, p, s, full, thumb) => ({ url: await toData(full), thumb: await toData(thumb) }),
    save: put,
    update: (id, data) => put({ ...(mem.get(id) || {}), ...data }),
    recent: async () => { try { const all = await tx('readonly', s => s.getAll()); (all || []).forEach(r => mem.set(r.id, r)) } catch { } return [...mem.values()].sort((a, b) => b.fecha - a.fecha).slice(0, 60) },
    find: async t => [...mem.values()].filter(r => r.orden === t),
    ventasActivas: async () => DEMO_VENTAS,
    colaboradoras: async () => CONFIG.empleadas.map((e, i) => ({ id: String(i + 1), nombre: e.nombre, codigo: String(e.codigo) }))
  };
}

/* ---------- Subida en segundo plano ---------- */
// Subidas de a 2 a la vez (en celular con señal débil, muchas juntas se traban)
let _activas = 0; const _cola = [];
function enCola(fn) { return new Promise((res, rej) => { _cola.push({ fn, res, rej }); _sig() }) }
function _sig() { while (_activas < 2 && _cola.length) { const { fn, res, rej } = _cola.shift(); _activas++; fn().then(res, rej).finally(() => { _activas--; _sig() }) } }
const conLimite = (p, ms) => Promise.race([p, new Promise((_, r) => setTimeout(() => r(Object.assign(new Error('tardó demasiado'), { code: 'timeout' })), ms))]);
function motivoError(e) {
  const c = String(e && (e.code || e.message) || e);
  if (/unauthorized|permission/i.test(c)) return 'falta el permiso en Firebase Storage (reglas). Toca ↻ cuando esté listo.';
  if (/timeout|retry-limit|network|tardó/i.test(c)) return 'la conexión está lenta. Toca ↻ para reintentar.';
  if (/quota/i.test(c)) return 'se superó la cuota de Firebase Storage.';
  return c + '. Toca ↻ para reintentar.';
}
function capture(file, holder, key, recId, parId, slot, after) {
  const photo = { st: 'up', por: actor(), t: Date.now() };
  holder[key] = photo;
  let blobs = null; // fotos ya reducidas (no se guarda la original de 12 MP en memoria)
  const run = async () => {
    photo.st = 'up'; refreshTiles();
    try {
      if (!blobs) {
        blobs = await compress(file); file = null;
        photo.local = URL.createObjectURL(blobs.thumb); photo.localFull = URL.createObjectURL(blobs.full);
        Object.defineProperty(photo, '_file', { value: new File([blobs.full], 'foto.jpg', { type: 'image/jpeg' }), enumerable: false, configurable: true });
        refreshTiles();
      }
      const r = await enCola(() => conLimite(api.upload(recId, parId, slot, blobs.full, blobs.thumb), 45000));
      photo.url = r.url; photo.thumb = r.thumb; photo.st = 'ok';
      if (after) await after();
      if (view === 'new') guardarBorrador();
    } catch (e) { console.error(e); photo.st = 'err'; photo.errMsg = motivoError(e); toast('No se subió la foto: ' + photo.errMsg) }
    refreshTiles();
  };
  Object.defineProperty(photo, '_retry', { value: () => (photo._p = run()), enumerable: false, writable: true });
  Object.defineProperty(photo, '_p', { value: run(), enumerable: false, writable: true });
  refreshTiles();
}
const clean = p => ok(p) ? { url: p.url, thumb: p.thumb, por: p.por || '', t: p.t || null } : null;
const actor = () => view === 'new' ? draft?.recibidoPor || '' : cur?._quien || '';

function tile(id, holder, key, label, sub, opts = {}) {
  tiles[id] = { holder, key, label, sub, opts };
  return tileHTML(id);
}
function tileHTML(id) {
  const { holder, key, label, sub, opts } = tiles[id];
  tiles[id].sig = tileSig(id);
  const p = holder[key];
  const inp = opts.readonly ? '' : `<input type="file" accept="image/*" capture="environment" data-tile="${id}">`;
  if (p && !src(p)) return `<label class="tile" id="t-${id}"><span class="cam">⏳</span>${esc(label)}<span class="opt">procesando…</span></label>`;
  if (p) {
    const st = p.st === 'up' ? '<span class="st up">⏳</span>' : p.st === 'err' ? `<span class="st err" data-act="retry" data-id="${id}">↻</span>` : '<span class="st ok">✓</span>';
    if (opts.readonly) return `<div class="tile has" id="t-${id}" style="background-image:url('${src(p)}')" data-act="view" data-id="${id}"><span class="lb">${esc(label)}${sub ? ' · ' + esc(sub) : ''}</span></div>`;
    return `<label class="tile has" id="t-${id}" style="background-image:url('${src(p)}')">${inp}${st}<span class="lb">${esc(label)}${sub ? ' · ' + esc(sub) : ''}</span></label>`;
  }
  if (opts.readonly) return `<div class="tile" id="t-${id}"><span class="cam">—</span>${esc(label)}<span class="opt">sin foto</span></div>`;
  return `<label class="tile ${opts.req && opts.showErr ? 'req' : ''}" id="t-${id}">${inp}<span class="cam">📷</span>${esc(label)}${sub ? `<span class="opt">${esc(sub)}</span>` : ''}${opts.optional ? '<span class="opt">opcional</span>' : ''}</label>`;
}
const tileSig = id => { const t = tiles[id], p = t.holder[t.key]; return p ? (p.st || '') + '|' + src(p) : '' };
function refreshTiles() {
  for (const id in tiles) {
    const sig = tileSig(id); if (tiles[id].sig === sig) continue;
    const el = document.getElementById('t-' + id); if (el) { el.outerHTML = tileHTML(id) }

}

  const [a, b] = await Promise.allSettled([api.recent(), api.ventasActivas()]);

  const fin = new Set(CONFIG.estadosFinales.map(x => x.toLowerCase()));
  if (b.status === 'fulfilled') { ventas = b.value.filter(d => !fin.has(String(d.estado || '').trim().toLowerCase()) && !d.anulada && !d.eliminada).map(mapVenta).filter(v => v.pares > 0).sort((x, y) => String(x.entrega).localeCompare(String(y.entrega))); ventasOK = true }
  else { console.error(b.reason); ventasOK = false }
  if (a.status === 'rejected' || b.status === 'rejected') toast('Sin conexión con el sistema: se muestra lo guardado');

const tieneObs = p => p.nov.length > 0 || !!(p.nota || '').trim();
function validate(d) {
  const e = [];
  if (!d.orden.trim()) e.push('N° de orden');
  if (!d.cliente.trim()) e.push('Nombre del cliente');
  d.pares.forEach((p, i) => {
    const n = `Par ${i + 1}: `;
    ANTES.forEach(([k, l]) => { if (!p.f[k]) e.push(n + 'foto ' + l.toLowerCase()) });
    if (tieneObs(p) && !p.novFotos.length) e.push(n + 'foto de la observación');
    if (!p.sinPlant) PLANT.forEach(([k, l, s]) => { if (!p.f[k]) e.push(`${n}${l.toLowerCase()} (${s})`) });
  });
  const err = allPhotos(d).filter(x => x.st === 'err').length;
  if (err) e.push(`${err} foto(s) no subieron — toca ↻ en la foto`);
  return e;
}

    o.querySelector('.close').remove();
    const done = v => { obs.disconnect(); res(v) };
    const obs = new MutationObserver(() => { if (!document.body.contains(o)) done(null) }); obs.observe(document.body, { childList: true });

let colabs = null, esquema = ls.get('lyl-pin-esq', 'sha:salt:pin'); // Lavalyisto: SHA-256(salt + ":" + pin)
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');

};

  const plano = colabs.find(c => c.codigo && c.codigo === pin); if (plano) return plano;
  const lista = colabs.filter(c => c.hash);

document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  if (!api && !['tab', 'closeov', 'gal'].includes(a)) { toast('Conectando con el sistema…'); return }
  if (a === 'retry') { ev.preventDefault(); ev.stopPropagation(); const t = tiles[id]; toast('Reintentando…'); t.holder[t.key]._retry(); return }
  if (a === 'closeov') { el.closest('.ov').remove(); return }
  if (a === 'new') { const n = await pedirCodigo('Nueva recepción'); if (!n) return; draft = { id: api.newId(), orden: '', cliente: '', telefono: '', recibidoPor: n, pares: [newPar()] }; view = 'new'; render(); scrollTo(0, 0); guardarBorrador(); return }
  if (a === 'home') { if (view === 'new' && allPhotos(draft).length && !document.querySelector('.ov')) { const o = viewer(`<div class="card" style="max-width:340px"><h3>¿Salir sin guardar?</h3><p class="meta">Se perderán las fotos tomadas.</p><div class="row"><button class="btn alt" data-act="closeov">Seguir aquí</button><button class="btn" data-act="exitnew">Salir</button></div></div>`); return } view = 'home'; draft = null; render(); return }
  if (a === 'exitnew') { el.closest('.ov').remove(); view = 'home'; draft = null; borrarBorrador(); render(); return }
  if (a === 'draftgo') { const b = ls.get('lyl-draft', null); if (!b) return; b.pares.forEach(p => { p.f = p.f || {}; p.novFotos = p.novFotos || []; p.nov = p.nov || []; p.d = p.d || {} }); draft = b; view = 'new'; render(); scrollTo(0, 0); return }
  if (a === 'draftdel') { borrarBorrador(); render(); return }
  if (a === 'tab') { tab = v; q = ''; render(); return }
  if (a === 'refresh') { busy('Actualizando…'); await cargar(); busy(); render(); return }
  if (a === 'recibir') {
    const vv = ventas.find(x => x.folio === id); if (!vv) return;
    const ya = cache.find(r => r.ventaId === vv.folio); if (ya) { openRec(ya); return }
    const quien = await pedirCodigo('Recepción ' + vv.folio); if (!quien) return;
    const n = Math.min(Math.max(vv.pares, 1), 10);
    const descs = vv.zap.flatMap(it => Array(Number(it.piezas) || 1).fill(it.label));
    draft = { id: api.newId(), ventaId: vv.folio, entrega: vv.entrega, servs: vv.zap.map(it => `${nombreServ(it)} ×${it.piezas || 1}`).join(', ') + (vv.notas ? ` · Nota: ${vv.notas}` : ''), orden: vv.folio, cliente: vv.cliente, telefono: vv.tel, recibidoPor: quien, pares: Array.from({ length: n }, (_, i) => ({ ...newPar(), desc: '' })) };
    view = 'new'; q = ''; render(); scrollTo(0, 0); guardarBorrador(); return;
  }
  if (a === 'open') { const r = cache.find(x => x.id === id); if (r) openRec(r); return }
  if (a === 'findremote') { busy('Buscando…'); try { const rs = await api.find(folioDe(q)); busy(); if (rs.length) { rs.forEach(upsertCache); openRec(rs[0]) } else toast('No existe esa orden') } catch { busy(); toast('Sin conexión') } return }
  if (a === 'who') { draft.recibidoPor = v; ls.set('lyl-who', v); render(); return }
  if (a === 'addpar') { draft.pares.push(newPar()); guardarBorrador(); render(); setTimeout(() => scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 50); return }
  if (a === 'delpar') { draft.pares = draft.pares.filter(p => p.id !== id); guardarBorrador(); render(); return }
  if (a === 'nov') { const p = draft.pares.find(p => p.id === id); p.nov = p.nov.includes(v) ? p.nov.filter(x => x !== v) : [...p.nov, v]; guardarBorrador(); const y = scrollY; render(); scrollTo(0, y); return }
  if (a === 'save') { saveNew(); return }
  if (['addx', 'xres', 'estado', 'xtipo', 'delx'].includes(a) && view === 'detail' && !cur._quien) { if (!(await quienEnOrden('Confirmar tu código'))) return; render(); if (a !== 'addx' && a !== 'estado') return }
  if (a === 'addx') { const p = cur.pares.find(p => p.id === id); p.extras.push({ id: 'x' + rid(), tipo: '', precio: '', nota: '', estado: 'borrador', foto: null }); keepScroll(); return }
  if (a === 'delx') { const p = cur.pares.find(p => p.id === id); p.extras = p.extras.filter(x => x.id !== el.dataset.x); save(); keepScroll(); return }
  if (a === 'xtipo') { const [, x] = findX(id, el.dataset.x); x.tipo = v; keepScroll(); return }
  if (a === 'xmissing') { const [, x] = findX(id, el.dataset.x); toast(!x.tipo ? 'Elige el servicio' : !x.foto ? 'Toma la foto del detalle' : !ok(x.foto) ? 'La foto se está subiendo…' : 'Esta orden no tiene teléfono'); return }
  if (a === 'xsend' || a === 'xresend') { const [, x] = findX(id, el.dataset.x); marcarEnviado(x); return }
  if (a === 'xshare') { const [, x] = findX(id, el.dataset.x); try { await navigator.share({ files: [x.foto._file], text: xMsg(cur, x).replace(/\n\n📷 Foto: .*$/, '') }); marcarEnviado(x) } catch (e) { if (e.name !== 'AbortError') toast('No se pudo compartir') } return }
  if (a === 'xres') { const [, x] = findX(id, el.dataset.x); x.estado = v; x.t_resp = Date.now(); x.por_resp = cur._quien; save(); keepScroll(); toast(v === 'autorizado' ? 'Autorizado ✓ — agrégalo al cobro' : v === 'hecho' ? 'Servicio realizado ✓' : 'Registrado'); return }
  if (a === 'estado') { setEstado(v); return }
  if (a === 'view') { const t = tiles[id], p = t.holder[t.key]; if (view === 'detail') { const i = fotosDe(cur).findIndex(x => x.p === p); galeria(cur, Math.max(i, 0)) } else viewer(`<img src="${p.localFull || p.url}"><div class="cap">${esc(t.label)}</div>`); return }
  if (a === 'gal') { const r = cache.find(x => x.id === id); if (r) galeria(r, Number(el.dataset.i) || 0); return }
  if (a === 'galcur') { galeria(cur, 0); return }
  if (a === 'cmp') {
    const p = cur.pares.find(p => p.id === id);
    const o = viewer(`<div class="cmp"><img src="${p.d.zapato.localFull || p.d.zapato.url}"><img class="bef" src="${fotoAntes(p).localFull || fotoAntes(p).url}" style="clip-path:inset(0 50% 0 0)"><span class="tag" style="left:8px">ANTES</span><span class="tag" style="right:8px">DESPUÉS</span><div class="line" style="left:50%"></div></div><input type="range" min="0" max="100" value="50">`);
    o.querySelector('input').addEventListener('input', e => { const x = e.target.value; o.querySelector('.bef').style.clipPath = `inset(0 ${100 - x}% 0 0)`; o.querySelector('.line').style.left = x + '%' });
    return;
  }
});

document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.matches('[data-q]')) { q = t.value; renderList(); return }
  if (t.dataset.f && draft) { draft[t.dataset.f] = t.value; guardarBorrador(); return }
  if (t.dataset.xf && view === 'detail') { const [, x] = findX(t.dataset.id, t.dataset.x); x[t.dataset.xf] = t.value; clearTimeout(t._tm); t._tm = setTimeout(refreshSends, 250); return }
  if (t.dataset.pf && draft && t.type !== 'checkbox') { draft.pares.find(p => p.id === t.dataset.id)[t.dataset.pf] = t.value; guardarBorrador() }
});

document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.ck && view === 'detail' && !cur._quien) { t.checked = !t.checked; quienEnOrden('Confirmar tu código').then(n => { if (n) { t.checked = !t.checked; t.dispatchEvent(new Event('change', { bubbles: true })) } }); return }
  if (t.dataset.ck && view === 'detail') { cur.pares.find(p => p.id === t.dataset.id).check[t.dataset.ck] = t.checked; save(); if (cur._showErr) t.closest('.chk').classList.toggle('bad', !t.checked); return }
  if (t.dataset.pf === 'sinPlant' && draft) { draft.pares.find(p => p.id === t.dataset.id).sinPlant = t.checked; guardarBorrador(); const y = scrollY; render(); scrollTo(0, y); return }
  if (t.dataset.tile && t.files && t.files[0]) {
    const id = t.dataset.tile, info = tiles[id], file = t.files[0];
    const [parId, kind] = id.split('-');
    if (view === 'new') {
      const isNewNov = kind === 'n' && info.key === info.holder.length;
      capture(file, info.holder, info.key, draft.id, parId, kind + (kind === 'n' ? info.key : info.key), null);
      if (isNewNov || draft.showErr) { const y = scrollY; render(); scrollTo(0, y) }
    } else if (view === 'detail') {
      const r = cur;
      capture(file, info.holder, info.key, r.id, parId, (kind === 'x' ? 'x_' : 'd_') + info.key, () => { refreshSends(); return persistCur().catch(e => { console.error(e); toast('Foto subida, pero no se guardó en la orden') }) });
      refreshSends();
    }
  }
});

/* ---------- Inicio ---------- */
(async () => {
  // Abre al instante con la última copia guardada y actualiza por detrás
  const snap = !DEMO && ls.get('lyl-snap', null);
  if (snap) { cache = snap.cache || []; ventas = snap.ventas || []; ventasOK = true; render(); document.querySelector('[data-act=refresh]')?.classList.add('spinning') }
  const tiempo = (p, ms, msg) => Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error(msg)), ms))]);
  if (snap) window.__lylOk = true;
  try { api = DEMO ? demoBackend() : await tiempo(firebaseBackend(CONFIG.firebase), 20000, 'Firebase no respondió en 20 segundos') }
  catch (e) { console.error(e); if (snap) { toast('Sin conexión: se muestra lo guardado'); return } window.__lylOk = false; lylFallo('No se pudo conectar con Firebase: ' + (e.code || '') + ' ' + (e.message || e)); return }
  await tiempo(cargar(), 20000, 'timeout').catch(() => toast('El sistema tarda en responder: toca ↻'));
  window.__lylOk = true;
  if (view === 'home') { const y = scrollY; render(); scrollTo(0, y) }
})();
</script>
